[project]
name = "ucs-forecasting"
version = "0.1.0"
description = "Day-ahead solar generation forecasting for the UCS carbon trading platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucs_forecast"]

[tool.pytest.ini_options]
pythonpath = ["src"]
