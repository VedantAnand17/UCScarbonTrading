name: ucs-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ucs
      POSTGRES_PASSWORD: ucs
      POSTGRES_DB: ucs
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ucs -d ucs']
      interval: 2s
      timeout: 3s
      retries: 15

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: [anvil]
    command: [--host, '0.0.0.0', --chain-id, '31337']
    ports:
      - '127.0.0.1:8546:8545'
    healthcheck:
      test: [CMD, cast, chain-id, --rpc-url, 'http://127.0.0.1:8545']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
